name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report! Security issues must **not** go here — see [SECURITY.md](https://github.com/Victor-Alves0/AI-Workspace/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run AI Workspace?
      options:
        - Docker Compose
        - Desktop app (Windows)
        - From source (development)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Admin → Update, or the release you installed.
      placeholder: "0.7.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: 'Docker: `docker compose logs server --tail 200`. Desktop: `%APPDATA%\com.aiworkspace.app\data\api.err.log`. Remove any secrets before pasting.'
      render: text
