# Testes do backend a cada push/PR — inclusive a bateria de BANCO (tests/db/), que
# precisa de um Postgres de verdade com pgvector. É ela que pega, antes do deploy,
# migração que só quebra sobre dados reais (ex.: o 0078 com id > 32 caracteres, que
# pôs o servidor em loop de reinício) e restore que destrói dados.

name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # admin de um servidor descartável: cada teste cria/dropa o próprio banco
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml

      # pg_dump/pg_restore/psql 16 (mesma major do servidor) p/ o teste de backup;
      # ripgrep é usado pelas tools do Codespace que a suíte exercita
      - name: Ferramentas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16 ripgrep

      - name: Dependências
        working-directory: apps/server
        run: pip install -e ".[dev]"

      - name: Testes (inclui tests/db contra Postgres real)
        working-directory: apps/server
        run: python -m pytest -q -p no:cacheprovider
