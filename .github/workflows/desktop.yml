# Compila o aplicativo desktop (Windows) e publica o instalador numa Release.
#
# Roda no runner `windows-latest` porque ele já traz o MSVC (link.exe + Windows SDK)
# e o Node — assim ninguém precisa instalar ~4 GB de Build Tools na própria máquina
# para gerar um .exe, e o build fica reproduzível.
#
#   git tag v0.1.0 && git push origin v0.1.0   -> compila e publica a Release
#   (aba Actions -> Run workflow)              -> só compila e anexa o artefato

name: Desktop (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # necessário para criar a Release e anexar o instalador
    steps:
      - uses: actions/checkout@v4

      # Importa o certificado de code signing (self-signed) no store do runner.
      # O Tauri acha pelo `certificateThumbprint` do tauri.conf.json e assina o
      # binario + o instalador NSIS. Sem o secret (fork/PR), sai NAO assinado.
      - name: Importar certificado de assinatura
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) { Write-Host "Sem certificado — build sai NAO assinado."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $pw = ConvertTo-SecureString -String $env:CERT_PW -Force -AsPlainText
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw | Out-Null
          Remove-Item $pfx -Force
          Write-Host "Certificado importado."

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Python do runner: instala o backend no Python embarcado do motor (--target).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # cache do target/ do Cargo: sem ele cada build recompila todo o Tauri (~10 min)
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Instalar dependências do desktop
        working-directory: desktop
        run: npm install

      # Monta o motor (Postgres + backend + frontend) DENTRO de src-tauri/engine,
      # que o tauri.conf.json empacota como recurso ("resources": ["engine/**/*"]).
      # Sem -Zip: queremos a pasta, nao o zip.
      - name: Montar o motor embarcado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: desktop/engine/build-engine.ps1 -OutDir "$env:GITHUB_WORKSPACE/desktop/src-tauri/engine"

      # --- disparo por TAG: compila e publica a Release com o instalador ---
      - name: Compilar e publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: AI Workspace ${{ github.ref_name }}
          releaseBody: |
            Aplicativo desktop para Windows.

            Instale e abra: o app carrega a interface do AI Workspace numa janela
            nativa, com ícone na bandeja, "rodar em segundo plano" e "iniciar com o
            Windows" (Configurações -> Aplicativo).

            Requer o servidor no ar (por padrão `http://localhost:3000`; dá para
            apontar para outra máquina em Configurações -> Aplicativo).
          releaseDraft: false
          prerelease: false

      # --- disparo manual: só compila e anexa o instalador como artefato ---
      - name: Compilar (sem publicar)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop

      - name: Anexar instalador ao run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: aiworkspace-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
