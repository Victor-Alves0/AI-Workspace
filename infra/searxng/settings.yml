# SearXNG — metabuscador self-hosted usado pela Pesquisa na Web do AI Workspace.
# Sobe opt-in: `docker compose --profile search up -d`.
# O backend consulta GET /search?format=json, então o formato JSON PRECISA estar
# ligado (search.formats abaixo) e o limiter DESLIGADO (uso interno na rede do
# compose; a porta é publicada só em 127.0.0.1).
use_default_settings: true

general:
  instance_name: "AI Workspace Search"
  # não divulga esta instância publicamente
  donation_url: false
  contact_url: false

server:
  # Troque por um valor aleatório próprio se quiser:
  #   python -c "import secrets; print(secrets.token_hex(32))"
  secret_key: "ea061d003e653e10a5f118e292fdf8daa2cba1c1bbe3b1c33cb10a30d427ccaf"
  # instância interna (rede do compose): sem rate-limit, senão a API JSON é barrada
  limiter: false
  public_instance: false
  image_proxy: true

search:
  # HTML (UI, se você abrir :8080) + JSON (consumido pelo backend)
  formats:
    - html
    - json
  safe_search: 1
  autocomplete: ""

# motores: os padrões do SearXNG + alguns extras ligados abaixo.
# Rodando numa VPS/datacenter, Google e DuckDuckGo costumam responder CAPTCHA ao IP do
# servidor ("SearxEngineCaptchaException" no log) — com só eles, TODA busca volta vazia.
# Por isso ligamos motores que toleram melhor IP de servidor: com vários, basta um
# responder. O teste de conexão (Configurações → Pesquisa) lista quais falharam e por quê.
# Para desligar algum: `- name: <motor>` + `disabled: true`.
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
