services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiworkspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiworkspace}
      POSTGRES_DB: ${POSTGRES_DB:-aiworkspace}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # cria bancos extras (ex.: "evolution") no PRIMEIRO init do volume. Em
      # volumes já existentes não roda — crie na mão: `docker compose exec db
      # createdb -U aiworkspace evolution`
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro
    # Por padrão o Postgres NÃO é publicado no host — a aplicação o acessa pela rede
    # interna do compose (db:5432), então não há como colidir com um Postgres que
    # você já rode no PC. Para acessar com um cliente externo (psql/DBeaver), copie
    # docker-compose.override.yml.example para docker-compose.override.yml (a porta
    # sai de DB_PORT no .env). Sem cliente externo, use `docker compose exec db psql`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiworkspace} -d ${POSTGRES_DB:-aiworkspace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./apps/server
      args:
        # commit desta build (o update.sh exporta antes de reconstruir). Permite ao
        # painel comparar COMMIT a commit, e não só a tag de release. Vazio = degrada
        # p/ a comparação por release. Ver docs/trust-model.md e update.sh.
        GIT_COMMIT: ${GIT_COMMIT:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Segredo da app. PREFIRA APP_SECRET_FILE (abaixo): passado por env, ele fica
      # legível em /proc/1/environ para QUALQUER comando que a IA executar no container
      # (o _clean_env limpa o env do filho, mas não o /proc do PID 1). Ver
      # docs/trust-model.md e SECURITY-secrets.md.
      APP_SECRET: ${APP_SECRET:-}
      APP_SECRET_FILE: ${APP_SECRET_FILE:-}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      # Cadastro NÃO tem chave de ambiente: quem decide é o admin no painel
      # (app_config.signups_allowed — fechado por padrão). Ver docs/trust-model.md.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-duckduckgo}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      VOICE_BASE_URL: ${VOICE_BASE_URL:-https://api.openai.com/v1}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiworkspace}:${POSTGRES_PASSWORD:-aiworkspace}@db:5432/${POSTGRES_DB:-aiworkspace}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Embedder da descoberta de tools da SIFT. O default (bge-small-en) é
      # inglês-only e forte; o system prompt instrui o modelo a escrever queries
      # do search_tools em INGLÊS (com fallback no idioma do usuário p/ tools
      # descritas em outro idioma). Para um índice multilíngue de verdade, troque
      # p/ intfloat/multilingual-e5-large (~2.2GB; o cache .npz inclui o modelo
      # no hash → a troca auto-invalida índices antigos).
      SIFT_EMBED_MODEL: ${SIFT_EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      # Integração WhatsApp (caminho não oficial via Evolution; vazio = desabilitado)
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      # base das URLs de webhook (Cloud API oficial exige uma URL pública https)
      WHATSAPP_WEBHOOK_BASE: ${WHATSAPP_WEBHOOK_BASE:-http://server:8000}
      # Navegador headless (tool "web.browser.use"): serviço opt-in `browser`
      # (browserless). Vazio = tool desativada. O token protege o endpoint CDP.
      BROWSER_WS_URL: ${BROWSER_WS_URL:-ws://browser:3000}
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}
      # Transcrição de vídeo (yt-dlp) anti-bloqueio: pasta com arquivos cookies.txt
      # (Netscape) — cada arquivo é uma identidade rotacionada. Vazio = só headers.
      # Monte a pasta do host no volume abaixo e aponte TRANSCRIBE_COOKIES_DIR p/ ela.
      TRANSCRIBE_COOKIES_DIR: ${TRANSCRIBE_COOKIES_DIR:-}
      TRANSCRIBE_COOKIE_COOLDOWN_SECONDS: ${TRANSCRIBE_COOKIE_COOLDOWN_SECONDS:-1800}
      # Redirects do OAuth. Estas linhas FALTAVAM: o .env.example documentava as
      # quatro variáveis, mas sem constarem aqui elas nunca chegavam ao container —
      # o server ficava preso no default localhost:8000. Numa VPS isso impedia
      # Google/GitHub/Notion/Slack de funcionarem, porque o endereço de retorno
      # jamais batia com o cadastrado no console do provedor.
      # O default de cada uma é repetido aqui de propósito: `${VAR:-}` passaria
      # uma string VAZIA quando a variável não existe no .env, e a vazia GANHA do
      # default do config.py — trocaria um bug por outro.
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/integrations/google/callback}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/integrations/github/callback}
      NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI:-http://localhost:8000/integrations/notion/callback}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-http://localhost:8000/integrations/slack/callback}
      OPENROUTER_REDIRECT_URI: ${OPENROUTER_REDIRECT_URI:-http://localhost:8000/integrations/providers/openrouter/callback}
      # Client ID público do "Entrar com GitHub" por código (device flow).
      GITHUB_DEVICE_CLIENT_ID: ${GITHUB_DEVICE_CLIENT_ID:-}
    volumes:
      # persiste modelos de embedding (fastembed/HF) e índices SIFT (.npz)
      # entre recriações do container — cold start rápido
      - mlcache:/home/app/.cache
      # Codespace: working copies dos projetos + índices do GraphCodeMap
      # (.codegraph/graph.db por projeto) — precisa sobreviver a rebuilds
      - codespace_data:/data/codespace
      # Cookies do yt-dlp (anti-bloqueio da transcrição). Descomente e ajuste o
      # caminho do host; depois no .env: TRANSCRIBE_COOKIES_DIR=/data/yt-cookies
      # - ./secrets/yt-cookies:/data/yt-cookies:ro
      # Segredos por ARQUIVO (recomendado no perfil servidor): descomente e siga as
      # instruções do .env.example. Mantém APP_SECRET fora de /proc/1/environ, onde
      # qualquer comando executado pela IA conseguiria lê-lo. Ver docs/trust-model.md.
      # - ./secrets:/run/secrets:ro
    ports:
      # host bind + porta configuráveis (o painel do admin diz quais valores pôr
      # no .env). Ex.: SERVER_BIND=127.0.0.1 SERVER_PORT=8000
      - "${SERVER_BIND:-0.0.0.0}:${SERVER_PORT:-8000}:8000"
      # Callback fixo do login ChatGPT/Codex. A OpenAI retorna para
      # localhost:1455; esta publicação permite concluir o OAuth sem copiar URL
      # quando o navegador roda na mesma máquina do AI Workspace.
      - "${CHATGPT_OAUTH_BIND:-127.0.0.1}:${CHATGPT_OAUTH_PORT:-1455}:8000"
      # Codespace: previews "own-origin" — a IA sobe um app numa porta deste range,
      # publicada no host, pra apps completos (Metabase etc.) rodarem na RAIZ da própria
      # origem (login/redirect/SPA/websocket funcionam). DEVE bater com code_preview_port_*.
      # ATENÇÃO: a porta publicada NÃO tem autenticação — quem alcança o host abre o app.
      # Por isso o padrão é 127.0.0.1 (só a própria máquina). De outros dispositivos, use
      # o proxy AUTENTICADO: /codespace/preview/<porta>/. Só ponha PREVIEW_BIND=0.0.0.0 se
      # aceitar previews abertos na sua rede. Ver docs/trust-model.md.
      - "${PREVIEW_BIND:-127.0.0.1}:${PREVIEW_PORT_MIN:-4001}-${PREVIEW_PORT_MAX:-4010}:${PREVIEW_PORT_MIN:-4001}-${PREVIEW_PORT_MAX:-4010}"

  # Voz local (TTS) — Kokoro-FastAPI, endpoint OpenAI-compatível em :8880/v1.
  # OPT-IN: só sobe com `docker compose --profile voice up -d kokoro`.
  # CPU por padrão (baixa os pesos ~350MB no 1º start). Para GPU NVIDIA, troque a
  # imagem por `-gpu` e adicione o runtime de GPU (ver docs). O server acessa em
  # http://kokoro:8880/v1 (use esse endereço na conexão "Voz Local").
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: ["voice"]
    restart: unless-stopped
    ports:
      - "${KOKORO_BIND:-127.0.0.1}:${KOKORO_PORT:-8880}:8880"

  # SearXNG — metabuscador self-hosted para a Pesquisa na Web (sem chave de API).
  # OPT-IN: `docker compose --profile search up -d searxng`. Depois, no .env:
  #   WEB_SEARCH_PROVIDER=searxng   (o server já aponta p/ http://searxng:8080)
  # Config em infra/searxng/settings.yml (formato JSON ligado, limiter desligado).
  searxng:
    image: searxng/searxng:latest
    profiles: ["search"]
    restart: unless-stopped
    volumes:
      - ./infra/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8080}/
    ports:
      # só no host (127.0.0.1): o server acessa pela rede do compose (searxng:8080)
      - "${SEARXNG_BIND:-127.0.0.1}:${SEARXNG_PORT:-8080}:8080"

  # WhatsApp NÃO oficial (QR Code) — Evolution API (Baileys).
  # OPT-IN: só sobe com `docker compose --profile whatsapp up -d`.
  # Requer o banco "evolution" no Postgres (criado automaticamente em volumes
  # novos via infra/db-init; em volumes existentes: `docker compose exec db
  # createdb -U aiworkspace evolution`) e EVOLUTION_API_KEY no .env.
  # O caminho OFICIAL (Meta Cloud API) NÃO precisa deste serviço.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: ["whatsapp"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-aiworkspace}:${POSTGRES_PASSWORD:-aiworkspace}@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_LOCAL_ENABLED: "true"
      CACHE_REDIS_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: AI Workspace
      LOG_LEVEL: ERROR
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "${EVOLUTION_BIND:-127.0.0.1}:${EVOLUTION_PORT:-8081}:8080"

  # Navegador headless (Chromium) — browserless v2, para a tool "web.browser.use".
  # OPT-IN: só sobe com `docker compose --profile browser up -d browser`. O server
  # o dirige por Playwright via CDP (ws://browser:3000). Defina BROWSER_TOKEN no .env
  # (o mesmo valor vai para o server em BROWSER_TOKEN) para proteger o endpoint.
  # Concurrency/timeout limitam abuso; o binário do Chromium fica SÓ aqui.
  browser:
    image: ghcr.io/browserless/chromium:latest
    profiles: ["browser"]
    restart: unless-stopped
    environment:
      TOKEN: ${BROWSER_TOKEN:-}
      CONCURRENT: ${BROWSER_CONCURRENT:-5}
      TIMEOUT: ${BROWSER_TIMEOUT_MS:-60000}
    ports:
      # só no host (127.0.0.1), p/ debug: o server acessa pela rede do compose
      # (browser:3000). Porta 3009 no host p/ NÃO colidir com o web (3000).
      - "${BROWSER_BIND:-127.0.0.1}:${BROWSER_PORT:-3009}:3000"

  web:
    build:
      context: ./apps/web
      args:
        # vazio => o front deriva a API do host da página (window.location:8000),
        # permitindo acesso pela LAN (ex.: celular via IP da máquina). Defina no
        # .env apenas para um domínio/porta próprios.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  mlcache:
  evolution_instances:
  codespace_data:
