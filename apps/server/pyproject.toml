[project]
name = "aiworkspace-server"
# FONTE ÚNICA da versão do produto. `aiworkspace.__version__` deriva daqui (metadados do
# pacote instalado) e os arquivos do desktop são sincronizados por scripts/set_version.py.
# O teste tests/test_version_sync.py falha se algum deles divergir.
version = "0.6.2"
description = "AI Workspace — backend FastAPI (chat, SIFT tools, mem0 memory, OpenRouter)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=44.0",
    # [socks] = socksio: proxy SOCKS5 na saída. Necessário para o Remote Terminal
    # falar com a máquina do usuário por um túnel (Tor/SSH -D/Shadowsocks) sem
    # expor o IP do servidor — sem o extra, um proxy socks5:// falharia no import
    # e o killswitch recusaria a conexão em vez de sair direto.
    "httpx[socks]>=0.28",
    "python-multipart>=0.0.12",
    "ddgs>=6.0",
    # extração de texto de anexos (integração "Extração de Texto")
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    # OCR (imagens e PDFs escaneados): tesseract via pytesseract + rasterização
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "pillow>=11.0",
    # blocos do usuário
    # v0.7: 2 meta-tools (search_tools+execute_tool; run_code exposto via
    # code_tools()), scope(pin=[...]) POR-ESCOPO (substituiu o hack _pinned),
    # adispatch/aexecute_tool no scope, erros estruturados com hint, coerção de
    # tipos nos params e hooks observer/on_risky/on_result.
    # Integração em tools/sift_service.py + tools/loader.py.
    "sift-tools>=0.8.2,<0.9",
    # Memória do usuário e Base de Conhecimento: nativas sobre o pgvector
    # (memory/memory_service, knowledge/embeddings), com o fastembed que a SIFT já
    # traz. Substituíram o mem0 + LangChain (36 pacotes, ~65 MB). Declarado aqui
    # porque o código importa o fastembed direto.
    "fastembed>=0.4.2",
    # Voz embutida (TTS): Kokoro-82M no próprio processo, pelo onnxruntime que o
    # fastembed já traz (integrations/voice_builtin). Substituiu o container do
    # Kokoro-FastAPI (~3,8 GB); acrescenta ~19 MB (espeak-ng). Pesos baixados no 1º uso.
    "kokoro-onnx>=0.6,<0.7",
    # Integração Google Workspace (Gmail + Agenda): REST direto por httpx (já
    # presente) — o google-api-python-client pesava ~110 MB para ~10 chamadas. O
    # state OAuth é assinado com pyjwt (já presente).
    # Web Push (notificações do navegador): pywebpush + py-vapid (usam cryptography,
    # já presente). Chaves VAPID geradas uma vez e guardadas em app_settings.
    "pywebpush>=2.0",
    # Gateway do Discord (canal): conexão WebSocket persistente por bot. httpx
    # cobre o REST (enviar mensagem), mas não faz WS — daí a lib dedicada.
    "websockets>=12",
    # 2FA (autenticação em dois fatores): TOTP (compatível com Google/Microsoft
    # Authenticator, Authy). qrcode renderiza o QR de pareamento (usa a Pillow já
    # presente). O segredo TOTP fica cifrado no banco (EncryptedText).
    "pyotp>=2.9",
    "qrcode>=8.0",
    # Transcrição de vídeo/áudio (tool "media.video.transcribe"): yt-dlp extrai
    # legendas OU baixa o áudio de YouTube e ~1800 outros sites. O caminho de FALA
    # (sem legendas) recomprime/fatia o áudio com ffmpeg (instalado no Dockerfile)
    # e transcreve pelo STT do usuário. Fixado numa faixa recente (o yt-dlp muda
    # rápido p/ acompanhar os sites; atualizar é rotina).
    "yt-dlp>=2024.12",
    # Navegador headless (tool "web.browser.use"): CDP puro pelo `websockets` (acima),
    # sem Playwright — que pesava ~140 MB só para ser um cliente CDP. O Chromium é o
    # serviço `browser` (browserless) no Docker, ou o Edge/Chrome local no desktop.
    # Codespace — grafo de código (tools "code.graph.query"/"code.files.browse"):
    # GraphCodeMap (projeto próprio do Victor, ainda não publicado no PyPI — o
    # nome "codegraph" no PyPI é de OUTRO pacote, não confundir). Pinado num
    # commit (alpha v0.1.0, sem tags) p/ build reprodutível; import é `codegraph`.
    # [l1] ativa o resolver via jedi (promove chamadas Python de "inferred"/
    # "possible" a "certain" — mais lento, roda em background/sob demanda).
    # 2234959 (= tag v0.1.0, 1º release público): extractor Terraform/HCL (16ª
    # linguagem), L1 com transparência por-aresta (resolver·confidence·reason) +
    # monorepo + multi-def/overloads, visualize investigativo (modos semeados
    # neighborhood/callers/callees/impact/domains + filtros min_confidence/
    # language/git — `level=` segue compatível), read-repair descobre arquivos
    # NOVOS, 10 invariantes de contrato travados (inclui "nunca vaza path
    # absoluto"). API de host que consumimos é 100% compatível com 45a35c4.
    # 4eba4c9 (03/08): anti-explosão de taint/reaches — deadline + memo global +
    # budget + truncation. É o bound INTERNO que faz a análise TERMINAR sozinha,
    # complementando o watchdog de 120s por-tool ([[tool-call-watchdog]]): a taint
    # que pendurou o turno no Metabase agora respeita um teto de tempo/nós. API
    # de host 100% compatível com 2234959.
    # SEM o extra [l1]: ele só traz o jedi (~5,6 mil arquivos), usado apenas pelo
    # refinamento L1 sob demanda (POST /codespace/projects/{id}/refine). Grafo, busca
    # e tools de código não precisam dele. Quem quiser o refinamento instala o extra
    # `graph-refine` abaixo (a imagem Docker instala; o app desktop não).
    "graphcodemap @ https://github.com/Victor-Alves0/graphcodemap/archive/4eba4c9ac393afe48c13d48d551b5e3ec68f63c0.tar.gz",
]

[project.optional-dependencies]
# WhatsApp por QR sem a Evolution API: o whatsmeow (Go) embutido. Vai no motor do app
# desktop (build-engine.ps1); a imagem Docker segue com a Evolution e não instala isto.
whatsapp-local = [
    "neonize>=0.5.2,<0.6",
]
# refinamento L1 do grafo de código (jedi resolve chamadas Python: inferred → certain)
graph-refine = [
    "jedi>=0.19",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiworkspace*"]
