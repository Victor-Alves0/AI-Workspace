[package]
name = "aiworkspace-desktop"
version = "0.3.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

# O instalador é o que o usuário baixa: otimiza para TAMANHO, não para velocidade
# de compilação (o CI compila uma vez por release, então o tempo extra não dói).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
