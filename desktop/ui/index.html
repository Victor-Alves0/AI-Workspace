<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Workspace</title>
<!--
  Tela de "iniciando". A janela abre aqui enquanto o motor embarcado sobe (Postgres +
  servidor); o shell (main.rs / wait_and_show) navega para o app assim que a API
  responde. Tudo local e offline (nada de fonte/imagem externa): o motor ainda não subiu.

  Assinatura: a arte do login viva — linhas finas em "V" invertido subindo devagar até
  um ápice, surgindo embaixo e sumindo em cima. Gerada em canvas: loop sem emenda,
  nítida em qualquer tamanho, zero MB no instalador.
-->
<style>
  :root {
    --bg: #09090c;
    --ink: #ecebf5;
    --muted: #7c7f8c;
    --line: 201, 196, 255;   /* rgb das linhas */
    --accent: #8b7cf6;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f5f8; --ink: #17171d; --muted: #6a6d78; --line: 92, 78, 200; --accent: #6d5ce8; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* barra de título embutida (a janela não tem moldura do Windows) */
  .bar { position: fixed; inset: 0 0 auto 0; height: 32px; z-index: 10; display: flex; align-items: center; }
  .bar .drag { flex: 1; height: 100%; }
  .bar button {
    width: 46px; height: 100%; border: 0; background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: default;
  }
  .bar button:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); }
  .bar button.close:hover { background: #c42b1c; color: #fff; }
  .bar svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.3; }
  /* véu embaixo: o texto fica legível sobre as linhas */
  .veil {
    position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(to top, var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 22%, transparent 48%);
  }
  main {
    position: fixed; left: clamp(24px, 6vw, 72px); right: 24px; bottom: clamp(28px, 7vh, 64px);
    display: grid; gap: 14px;
  }
  .brand {
    margin: 0; font-weight: 400; letter-spacing: .32em; text-transform: uppercase;
    font-size: clamp(13px, 1.25vw, 15px); color: var(--ink);
    opacity: 0; animation: rise 1.1s cubic-bezier(.16, 1, .3, 1) .15s forwards;
  }
  .brand b { font-weight: 600; letter-spacing: .32em; }
  .status {
    margin: 0; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    font: 12.5px/1.5 "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
    color: var(--muted);
    opacity: 0; animation: rise 1.1s cubic-bezier(.16, 1, .3, 1) .35s forwards;
  }
  .status .now { color: var(--ink); }
  .status .now::before {
    content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 10px;
    border-radius: 50%; background: var(--accent); vertical-align: 1px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .status .time { font-variant-numeric: tabular-nums; }
  .hint {
    margin: 0; max-width: 34rem; font-size: 13px; line-height: 1.55; color: var(--muted);
    opacity: 0; transform: translateY(6px); transition: opacity .8s ease, transform .8s ease;
  }
  .hint.on { opacity: 1; transform: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .brand, .status { animation: none; opacity: 1; }
    .status .now::before { animation: none; }
  }
</style>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="bar" id="bar" hidden>
    <div class="drag" data-tauri-drag-region></div>
    <button type="button" id="b-min" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
    <button type="button" id="b-max" title="Maximizar" aria-label="Maximizar"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></svg></button>
    <button type="button" id="b-close" class="close" title="Fechar" aria-label="Fechar"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div class="veil" aria-hidden="true"></div>
  <main>
    <p class="brand">AI <b>Workspace</b></p>
    <p class="status" role="status" aria-live="polite">
      <span class="now" id="now">Iniciando</span>
      <span class="time" id="time">0s</span>
    </p>
    <p class="hint" id="hint">A primeira abertura prepara o banco de dados e baixa o modelo de busca. Pode levar um ou dois minutos; as próximas são rápidas.</p>
  </main>

<script>
(() => {
  // --------------------------------------------------------- barra da janela --
  const w = window.__TAURI__?.window?.getCurrentWindow?.();
  if (w) {
    document.getElementById("bar").hidden = false;
    document.getElementById("b-min").onclick = () => w.minimize();
    document.getElementById("b-max").onclick = () => w.toggleMaximize();
    document.getElementById("b-close").onclick = () => w.close();
    document.querySelector(".bar .drag").ondblclick = () => w.toggleMaximize();
  }
})();
(() => {
  // ------------------------------------------------------------------ status --
  // O shell não informa a etapa; o texto acompanha o tempo típico de cada fase.
  const etapas = [[0, "Iniciando"], [2, "Subindo o banco de dados"], [5, "Carregando o servidor"], [14, "Preparando a interface"]];
  const t0 = performance.now();
  const now = document.getElementById("now"), time = document.getElementById("time"), hint = document.getElementById("hint");
  setInterval(() => {
    const s = Math.floor((performance.now() - t0) / 1000);
    time.textContent = s < 60 ? `${s}s` : `${Math.floor(s / 60)}min ${String(s % 60).padStart(2, "0")}s`;
    const e = etapas.filter(([t]) => s >= t).pop();
    if (e && now.textContent !== e[1]) now.textContent = e[1];
    if (s >= 12) hint.classList.add("on");
  }, 250);

  // ------------------------------------------------------------------- linhas --
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1;
  const rgb = () => getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
  let cor = rgb();
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { cor = rgb(); });

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  // Duas camadas de "V" invertidos (a de trás mais lenta e mais larga): paralaxe leve.
  // Cada linha é uma fase 0..1 que sobe continuamente; ao passar do topo volta ao fim —
  // como o espaçamento é constante, a volta é invisível (loop sem emenda).
  const camadas = [
    { n: 34, speed: 0.012, spread: 1.25, alpha: 0.20, width: 1.0 },
    { n: 26, speed: 0.020, spread: 0.95, alpha: 0.58, width: 1.2 },
  ];

  function desenha(tempo) {
    ctx.clearRect(0, 0, W, H);
    const cx = W * 0.5, apex = H * 0.14, base = H * 1.08;
    for (const L of camadas) {
      for (let i = 0; i < L.n; i++) {
        // fase: 0 = embaixo, 1 = no ápice
        const f = ((i / L.n) + tempo * L.speed) % 1;
        const y = base - (base - apex) * f;
        // abertura: larga embaixo, fechando perto do ápice (perspectiva)
        const half = (W * 0.62 * L.spread) * Math.pow(1 - f, 0.85) + 18;
        const drop = half * 0.78;
        // aparece embaixo, some no alto; brilha no meio do caminho
        const a = L.alpha * Math.sin(Math.PI * Math.min(1, f * 1.05)) * (0.55 + 0.45 * Math.sin(Math.PI * f));
        if (a <= 0.004) continue;
        ctx.strokeStyle = `rgba(${cor}, ${a.toFixed(3)})`;
        ctx.lineWidth = L.width;
        ctx.beginPath();
        ctx.moveTo(cx - half, y + drop);
        ctx.lineTo(cx, y);
        ctx.lineTo(cx + half, y + drop);
        ctx.stroke();
      }
    }
    // brilho suave no ápice: o ponto para onde tudo converge
    const g = ctx.createRadialGradient(cx, apex, 0, cx, apex, Math.max(W, H) * 0.32);
    g.addColorStop(0, `rgba(${cor}, 0.10)`);
    g.addColorStop(1, `rgba(${cor}, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  if (reduce) { desenha(0); addEventListener("resize", () => desenha(0)); return; }
  let inicio = null;
  function frame(ts) {
    if (inicio === null) inicio = ts;
    desenha((ts - inicio) / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
