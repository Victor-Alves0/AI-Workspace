<!doctype html>
<meta charset="utf-8" />
<title>AI Workspace</title>
<!--
  Tela de "iniciando...". A janela abre aqui enquanto o motor embarcado sobe
  (Postgres + backend + interface); o shell (main.rs / wait_and_show) navega para
  http://localhost:3000 assim que a interface responde. Na primeira execucao isso
  pode levar 1-2 min (initdb + migracoes + baixar o modelo de embeddings).
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0b0d12; color: #e8eaf0;
  }
  @media (prefers-color-scheme: light) { body { background: #f6f7f9; color: #1b1e26; } }
  main { max-width: 30rem; padding: 2rem; text-align: center; }
  .dot {
    width: 44px; height: 44px; margin: 0 auto 1.25rem; border-radius: 50%;
    background: conic-gradient(from 0deg, #6366f1, #8b5cf6, #6366f1);
    -webkit-mask: radial-gradient(farthest-side, transparent 62%, #000 64%);
            mask: radial-gradient(farthest-side, transparent 62%, #000 64%);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.15rem; margin: 0 0 .35rem; }
  p { margin: .35rem 0; opacity: .7; }
  small { opacity: .5; }
</style>
<main>
  <div class="dot"></div>
  <h1>Iniciando o AI Workspace…</h1>
  <p>Preparando o banco de dados e o servidor.</p>
  <p><small>Na primeira vez pode levar um ou dois minutos.</small></p>
</main>
